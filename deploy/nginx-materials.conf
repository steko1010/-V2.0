# =============================================================
# 物料认证管理系统 —— Nginx 站点配置（前后端分离部署）
# -------------------------------------------------------------
# 前端：public/ 目录整体作为站点根（含 login.html 与各页面）
# 后端：/api 与 /uploads 反向代理到本机 Node 服务(127.0.0.1:3000)
# 上传/导入均以 JSON/Base64 提交，请求体上限需与后端(50mb)匹配
# =============================================================
server {
    listen 80;
    # 改成实际访问地址：内网域名或服务器 IP，如 192.168.1.10
    server_name materials.example.com;

    # 上传附件、批量导入 Excel 的请求体上限（含 base64 附件）
    client_max_body_size 50m;

    # 站点根目录 = 项目 public 目录（部署时复制到服务器后修改）
    root /opt/material-cert-manager/public;
    index index.html;

    # ---- API：反向代理到后端 Node 服务 ----
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 大文件解析/批量导入可能耗时较长，放宽超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- 上传附件（供应商附件、图片等）----
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # ---- 前端静态页面 ----
    # 页面(html/css/js)、登录页均由 root 静态托管，无需额外规则
    location = /favicon.ico { access_log off; log_not_found off; }
}

# 若公司内网希望加 HTTPS，可再增加 443 监听并配置证书：
#   listen 443 ssl;
#   ssl_certificate     /etc/nginx/ssl/materials.crt;
#   ssl_certificate_key /etc/nginx/ssl/materials.key;
