<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>选型查重 - 物料开发认证管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">料</div>
        <div>
          <div class="name">物料认证管理</div>
          <div class="sub">Material Cert</div>
        </div>
      </div>
      <nav class="nav">
        <a data-menu="page:prestudy" href="prestudy.html">项目</a>
        <a data-menu="page:selection" href="selection.html">选型</a>
        <a data-menu="page:audits" href="audits.html">稽核</a>
        <a data-menu="page:projects" href="projects.html">BOM信息</a>
        <a data-menu="page:suppliers" href="suppliers.html">供应商信息</a>
        <a data-menu="page:qcps" href="qcps.html">关键工艺</a>
        <a data-menu="page:admin" href="admin.html">系统管理</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>选型查重</h1>
          <div class="desc">录入候选物料信息，自动判断是否已在物料库中，避免重复开发</div>
        </div>
      </div>

      <div class="card check-panel">
        <div class="card-title">候选物料信息</div>
        <div class="form-grid">
          <div class="form-item">
            <label>物料编码</label>
            <input id="q_code" placeholder="如：M-2026-0001">
          </div>
          <div class="form-item">
            <label>物料名称<span class="req">*</span></label>
            <input id="q_name" placeholder="必填，如：贴片电阻">
          </div>
          <div class="form-item">
            <label>型号规格</label>
            <input id="q_model" placeholder="如：0805-10K-1%">
          </div>
          <div class="form-item">
            <label>供应商</label>
            <input id="q_supplier" placeholder="供应商名称">
          </div>
          <div class="form-item">
            <label>制造商 / 品牌</label>
            <input id="q_manufacturer" placeholder="制造商 / 品牌">
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button class="btn btn-primary" onclick="doCheck()">🔍 开始查重</button>
          <button class="btn" onclick="clearForm()">清空</button>
        </div>
      </div>

      <!-- 查重结果 -->
      <div class="result-box" id="resultBox">
        <div class="icon" id="resultIcon"></div>
        <div>
          <div class="title" id="resultTitle"></div>
          <div class="tip" id="resultTip"></div>
        </div>
      </div>

      <div id="matchesArea" style="display:none">
        <div class="card">
          <div class="card-title">完全匹配 <span class="badge" id="exactCount"></span></div>
          <div id="exactList"></div>
          <div class="empty" id="exactEmpty" style="display:none"><div class="big">✅</div><div>无完全匹配</div></div>
        </div>
        <div class="card">
          <div class="card-title">相似物料 <span class="badge" id="fuzzyCount"></span></div>
          <div id="fuzzyList"></div>
          <div class="empty" id="fuzzyEmpty" style="display:none"><div class="big">👀</div><div>无相似物料</div></div>
        </div>
        <div class="card" id="addCard" style="display:none">
          <div class="card-title">将候选物料加入物料库</div>
          <div class="form-grid">
            <div class="form-item half"><label>物料名称<span class="req">*</span></label><input id="a_name" placeholder="必填"></div>
            <div class="form-item half"><label>供应商</label><input id="a_supplier" placeholder="供应商名称"></div>
            <div class="form-item half"><label>规格型号</label><input id="a_model" placeholder="如：0805-10K-1%"></div>
            <div class="form-item half"><label>认证状态</label><select id="a_status"></select></div>
          </div>
          <div style="display:flex; justify-content:flex-end; margin-top:18px;">
            <button class="btn btn-primary" onclick="addToLibrary()">确认加入物料库</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toast"></div>
  <script src="js/common.js"></script>
  <script src="js/select.js"></script>
</body>
</html>
