<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物料汇总表 - 物料开发认证管理系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">料</div>
        <div>
          <div class="name">物料认证管理</div>
          <div class="sub">Material Cert</div>
        </div>
      </div>
      <nav class="nav">
        <a data-menu="page:prestudy" href="prestudy.html">预研</a>
        <a data-menu="page:selection" href="selection.html">选型</a>
        <a data-menu="page:audits" href="audits.html">稽核</a>
        <a data-menu="page:projects" href="projects.html">项目信息</a>
        <a data-menu="page:suppliers" href="suppliers.html">供应商信息</a>
        <a data-menu="page:qcps" href="qcps.html">关键工艺</a>
        <a data-menu="page:admin" href="admin.html">系统管理</a>
      </nav>
    </aside>
    <main class="main">
      <div class="page-head">
        <div>
          <h1>物料汇总表</h1>
          <div class="desc">物料开发与认证信息总览，支持搜索、筛选与编辑</div>
        </div>
        <button class="btn" onclick="exportBatchData()" data-permission="action:export">📤 批量导出</button>
        <button class="btn" onclick="openBatchImportModal()" data-permission="action:import">📥 批量导入</button>
        <button class="btn btn-danger" onclick="batchDeleteMaterials()" data-permission="action:delete">🗑 批量删除</button>
        <button class="btn btn-primary" onclick="openModal('editModal')" data-permission="action:create">＋ 新增物料</button>
      </div>

      <div class="card">
        <div class="toolbar">
          <input type="text" id="keyword" class="search-input" placeholder="搜索编码 / 名称 / 型号 / 供应商...">
          <select id="filterCategory"><option value="">全部分类</option></select>
          <select id="filterStatus"><option value="">全部状态</option></select>
          <select id="filterSupplier"><option value="">全部供应商</option></select>
          <button class="btn" onclick="applyFilters()">查询</button>
          <button class="btn" onclick="resetFilters()">重置</button>
        </div>
        <div class="table-wrap">
          <table class="data-table" id="materialTable">
            <thead>
              <tr>
                <th style="width:36px"><input type="checkbox" id="matCheckAll" onclick="toggleMatAll(this)" title="全选本页"></th>
                <th>编码</th>
                <th>物料名称</th>
                <th>型号规格</th>
                <th>分类</th>
                <th>供应商</th>
                <th>制造商</th>
                <th>认证状态</th>
                <th>认证到期</th>
                <th>ROHS</th>
                <th>REACH</th>
                <th>申请人</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="empty" id="emptyBox" style="display:none">
            <div class="big">📭</div>
            <div>暂无物料数据，点击右上角「新增物料」开始录入</div>
          </div>
        </div>
        <div class="pagination" id="pagination"></div>
      </div>
    </main>
  </div>

  <!-- 新增/编辑弹窗 -->
  <div class="modal-mask" id="editModal">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">新增物料</h3>
        <button class="modal-close" onclick="closeModal('editModal')">×</button>
      </div>
      <div class="form-grid">
        <div class="form-item half">
          <label>物料名称<span class="req">*</span></label>
          <input id="f_name" placeholder="必填">
        </div>
        <div class="form-item half">
          <label>供应商</label>
          <input id="f_supplier" list="supList" placeholder="供应商名称">
          <datalist id="supList"></datalist>
        </div>
        <div class="form-item half">
          <label>规格型号</label>
          <input id="f_model" placeholder="如：0805-10K-1%">
        </div>
        <div class="form-item half">
          <label>认证状态</label>
          <select id="f_status"></select>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" onclick="closeModal('editModal')">取消</button>
        <button class="btn btn-primary" onclick="saveMaterial()">保存</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <script src="js/common.js"></script>
  <script src="js/materials.js"></script>
</body>
</html>
